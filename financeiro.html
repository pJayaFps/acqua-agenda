<script>
    document.addEventListener("DOMContentLoaded", () => {
        const loginData = JSON.parse(localStorage.getItem("loginData") || "{}");

        // Se não tiver login ou expirou
        if (!loginData.username || Date.now() > loginData.expiraEm) {
            localStorage.removeItem("loginData");
            window.location.replace("login.html");
        }
    });
</script>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Financeiro - Lavacar</title>

    <style>
        /* ========================================
   Financeiro Lavacar - CSS Profissional
   ======================================== */

        /* Importar fonte Inter do Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        /* ========================================
   Reset e Variáveis
   ======================================== */
        :root {
            --cor-primaria: #0A1A2F;
            --cor-secundaria: #1E3A5F;
            --cor-acento: #3B82F6;
            --cor-acento-hover: #2563EB;
            --cor-sucesso: #10B981;
            --cor-alerta: #F59E0B;
            --cor-perigo: #EF4444;
            --cor-fundo: #F8FAFC;
            --cor-fundo-card: #FFFFFF;
            --cor-texto: #1E293B;
            --cor-texto-secundario: #64748B;
            --cor-borda: #E2E8F0;
            --cor-hover: #F1F5F9;
            --sombra-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --sombra-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --sombra-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --raio-sm: 6px;
            --raio-md: 10px;
            --raio-lg: 14px;
            --transicao: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        /* ========================================
   Body
   ======================================== */
        body {

            background: linear-gradient(135deg, var(--cor-fundo) 0%, #E0E7FF 100%);
            color: var(--cor-texto);
            line-height: 1.6;
            min-height: 100vh;
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 20px;
        }

        /* ========================================
   Container Principal
   ======================================== */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            background: var(--cor-fundo-card);
            padding: 40px;
            border-radius: var(--raio-lg);
            box-shadow: var(--sombra-lg);
            animation: fadeIn 0.5s ease-out;
        }

        /* ========================================
   Títulos
   ======================================== */
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: white;
            text-align: center;
            margin-bottom: 32px;
            padding: 32px 28px;
            background: linear-gradient(135deg, var(--cor-primaria) 0%, var(--cor-secundaria) 100%);
            border-radius: var(--raio-lg);
            box-shadow: var(--sombra-md);
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            color: var(--cor-primaria);
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--cor-borda);
        }



        .btnsair {
            padding: 8px 16px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btnsair:hover {
            background-color: #ffffff;
            transform: scale(1.05);
        }

        .btnsair:active {
            transform: scale(0.95);
        }

        /* ========================================
   Filtros
   ======================================== */
        .filters {
            margin-bottom: 32px;
            text-align: center;
            padding: 24px;
            background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%);
            border-radius: var(--raio-md);
            border: 2px solid #BAE6FD;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        .filters label {
            font-weight: 500;
            font-size: 14px;
            color: var(--cor-texto);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .filters input[type="date"] {
            padding: 10px 14px;
            margin: 0 5px;
            border: 2px solid var(--cor-borda);
            border-radius: var(--raio-md);
            font-size: 14px;
            font-family: inherit;
            background: white;
            color: var(--cor-texto);
            transition: var(--transicao);
            outline: none;
        }

        .filters input[type="date"]:focus {
            border-color: var(--cor-acento);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .filters input[type="date"]:hover {
            border-color: var(--cor-acento);
        }

        .filters button {
            padding: 10px 20px;
            border: none;
            border-radius: var(--raio-md);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transicao);
            margin: 0 4px;
            box-shadow: var(--sombra-sm);
        }

        .filters button:nth-child(3) {
            background: linear-gradient(135deg, var(--cor-acento) 0%, var(--cor-acento-hover) 100%);
            color: white;
        }

        .filters button:nth-child(4) {
            background: linear-gradient(135deg, var(--cor-perigo) 0%, #DC2626 100%);
            color: white;
        }

        .filters button:nth-child(5) {
            background: linear-gradient(135deg, var(--cor-sucesso) 0%, #059669 100%);
            color: white;
        }

        .filters button:hover {
            transform: translateY(-2px);
            box-shadow: var(--sombra-md);
        }

        .filters button:active {
            transform: translateY(0);
        }

        /* ========================================
   Box de Totais
   ======================================== */
        .box {
            background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
            padding: 24px;
            border-radius: var(--raio-lg);
            margin-bottom: 32px;
            font-size: 16px;
            border: 2px solid #93C5FD;
            box-shadow: var(--sombra-sm);
        }

        .box h2 {
            color: var(--cor-primaria);
            border: none;
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 2px solid #93C5FD;
        }

        #totais-dia {
            font-size: 18px;
            font-weight: 600;
            color: var(--cor-texto);
            line-height: 2;
        }

        /* ========================================
   Canvas (Gráfico)
   ======================================== */
        canvas {
            display: block;
            margin: 32px auto;
            max-width: 100%;
            border-radius: var(--raio-md);
            box-shadow: var(--sombra-md);
            padding: 20px;
            background: white;
        }

        /* ========================================
   Blocos de Tabela
   ======================================== */
        .table-block {
            margin-bottom: 48px;
        }

        /* ========================================
   Tabelas
   ======================================== */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: var(--raio-md);
            overflow: hidden;
            box-shadow: var(--sombra-sm);
        }

        thead {
            background: linear-gradient(135deg, var(--cor-primaria) 0%, var(--cor-secundaria) 100%);
            color: white;
        }

        th {
            padding: 14px 16px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
        }

        td {
            padding: 14px 16px;
            text-align: center;
            border: 1px solid var(--cor-borda);
            font-size: 14px;
            color: var(--cor-texto);
            background: white;
        }

        tbody tr {
            transition: var(--transicao);
        }

        tbody tr:hover {
            background: var(--cor-hover);
        }

        tbody tr:nth-child(even) {
            background: #F9FAFB;
        }

        tbody tr:nth-child(even):hover {
            background: var(--cor-hover);
        }

        /* ========================================
   Total
   ======================================== */
        .total {
            font-size: 20px;
            font-weight: 700;
            color: var(--cor-primaria);
            margin-top: 20px;
            padding: 16px 20px;
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
            border-radius: var(--raio-md);
            border: 2px solid #FCD34D;
            text-align: center;
        }

        /* ========================================
   Responsividade
   ======================================== */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 24px;
                margin: 20px auto;
            }

            h1 {
                font-size: 26px;
                padding: 24px 20px;
            }

            h2 {
                font-size: 20px;
            }

            .filters {
                flex-direction: column;
                padding: 20px;
            }

            .filters label {
                width: 100%;
                flex-direction: column;
                align-items: flex-start;
            }

            .filters input[type="date"] {
                width: 100%;
                margin: 8px 0;
            }

            .filters button {
                width: 100%;
                margin: 8px 0;
            }

            .box {
                padding: 20px;
                font-size: 15px;
            }

            #totais-dia {
                font-size: 16px;
            }

            table {
                font-size: 12px;
            }

            th,
            td {
                padding: 10px 8px;
                font-size: 12px;
            }

            .total {
                font-size: 16px;
                padding: 12px 16px;
            }

            canvas {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 22px;
                padding: 20px 16px;
            }

            h2 {
                font-size: 18px;
            }

            .container {
                padding: 20px;
            }

            th,
            td {
                padding: 8px 6px;
                font-size: 11px;
            }
        }

        @media (min-width: 769px) {
            body {
                font-size: 16px;
            }

            .container {
                padding: 48px;
            }

            h1 {
                font-size: 36px;
            }
        }

        /* ========================================
   Animações
   ======================================== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========================================
   Scrollbar Personalizada
   ======================================== */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--cor-fundo);
            border-radius: var(--raio-sm);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--cor-borda);
            border-radius: var(--raio-sm);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--cor-acento);
        }

        /* ========================================
   Estados de Foco
   ======================================== */
        button:focus-visible,
        input:focus-visible {
            outline: 3px solid var(--cor-acento);
            outline-offset: 2px;
        }

        /* ========================================
   Tabela Responsiva (Scroll Horizontal)
   ======================================== */
        @media (max-width: 640px) {
            .table-block {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            table {
                min-width: 600px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Financeiro Geral 🔥 <button class="btnsair" id="btnSair" onclick="sair()">Sair</button> </h1>

        </header>




        <div class="filters">
            <label>De: <input type="date" id="data-inicio"></label>
            <label>Até: <input type="date" id="data-fim"></label>
            <button onclick="filtrar()">Filtrar 🔥</button>
            <button onclick="gerarPDF()">Gerar PDF 🔥</button>
            <button onclick="exportarExcel()">Exportar Excel 🔥</button>

        </div>

        <div class="box">
            <h2>Total Financeiro</h2>
            <div id="totais-dia"></div>
        </div>



        <canvas id="grafico"></canvas>

        <div class="table-block">
            <h2>Lavagens Normais</h2>
            <table>
                <thead>
                    <tr>
                        <th>Placa</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody id="tabela-normal"></tbody>
            </table>
        </div>

        <div class="table-block">
            <h2>Lavagens Especiais (PMG)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Placa</th>
                        <th>Categoria</th>
                        <th>Valor</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody id="tabela-pmg"></tbody>
            </table>
            <div id="somatorio-pmg" class="total"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script>



        let dadosNormais = [];
        let dadosPMG = [];
        let financeiro = {
            dias: {},       // { "2025-12-24": {normais:[], pmg:[]} }
            meses: {}       // { "2025-12": {normaisTotal:1000, pmgTotal:500} }
        };
        const VALOR_SIMPLES = 25;

        // Carrega todos os dados da API /api/financeiro
        async function carregarFinanceiro() {
            const res = await fetch("https://acqua-agenda-back-1.onrender.com/api/financeiro");
            const dados = await res.json();

            // Mapear os dados da API
            dadosNormais = dados.lavagens.map(l => ({ ...l, especial: l.especial || false }));
            dadosPMG = dados.especiais.map(l => ({ ...l }));

            // Preencher financeiro.dias para histórico
            organizarHistorico(dadosNormais, dadosPMG);

            atualizarTabelas(dadosNormais, dadosPMG);
            atualizarGraficos(dadosNormais, dadosPMG);
            atualizarTotais(dadosNormais, dadosPMG);
        }

        function sair() {
            localStorage.removeItem("loginData");
            window.location.href = "login.html";
        }

        // Se quiser, também pode adicionar via addEventListener, sem precisar do onclick no HTML:
        document.addEventListener("DOMContentLoaded", () => {
            const btnSair = document.getElementById("btnSair");
            if (btnSair) {
                btnSair.addEventListener("click", sair);
            }
        });


        // Organiza histórico diário/mensal
        function organizarHistorico(normais, pmg) {
            financeiro.dias = {};
            financeiro.meses = {};

            [...normais, ...pmg].forEach(l => {
                const dia = new Date(l.data_hora).toISOString().slice(0, 10); // "YYYY-MM-DD"
                const mes = dia.slice(0, 7); // "YYYY-MM"
                if (!financeiro.dias[dia]) financeiro.dias[dia] = { normais: [], pmg: [] };
                if (!financeiro.meses[mes]) financeiro.meses[mes] = { normaisTotal: 0, pmgTotal: 0 };

                if (l.categoria) {
                    financeiro.dias[dia].pmg.push(l);
                    financeiro.meses[mes].pmgTotal += l.valor;
                } else {
                    financeiro.dias[dia].normais.push(l);
                    financeiro.meses[mes].normaisTotal += l.valor;
                }
            });

            salvarLocalStorage();
        }

        // Salvar/Carregar do localStorage
        function salvarLocalStorage() {
            localStorage.setItem("financeiro", JSON.stringify(financeiro));
        }
        function carregarLocalStorage() {
            const dados = localStorage.getItem("financeiro");
            if (dados) financeiro = JSON.parse(dados);
        }

        // Atualiza tabelas
        function atualizarTabelas(normais, pmg) {
            // Normais
            let linhasNormal = "", totalNormal = 0;
            normais.forEach(l => {
                const data = new Date(l.data_hora).toLocaleDateString("pt-BR");
                const tipo = l.especial ? "Especial" : "Simples";
                const valor = l.especial ? l.valor : VALOR_SIMPLES;
                linhasNormal += `<tr><td>${l.placa}</td><td>${tipo}</td><td>R$ ${valor}</td><td>${data}</td></tr>`;
                totalNormal += valor;
            });
            document.getElementById("tabela-normal").innerHTML = linhasNormal;

            // PMG
            let linhasPMG = "", totalPMG = 0;
            let somatorioCategoria = { P: 0, M: 0, G: 0, Especial: 0 };
            pmg.forEach(l => {
                const data = new Date(l.data_hora).toLocaleDateString("pt-BR");
                const categoria = l.categoria || "Especial";
                linhasPMG += `<tr><td>${l.placa}</td><td>${categoria}</td><td>R$ ${l.valor}</td><td>${data}</td></tr>`;
                totalPMG += l.valor;
                somatorioCategoria[categoria] = (somatorioCategoria[categoria] || 0) + l.valor;
            });
            document.getElementById("tabela-pmg").innerHTML = linhasPMG;
            document.getElementById("somatorio-pmg").innerHTML =
                `🔥 Somatório por categoria: P R$${somatorioCategoria.P} / M R$${somatorioCategoria.M} / G R$${somatorioCategoria.G} / Especial R$${somatorioCategoria.Especial}`;

            return { totalNormal, totalPMG };
        }

        // Atualiza totais
        function atualizarTotais(normais, pmg) {
            const { totalNormal, totalPMG } = atualizarTabelas(normais, pmg);

            document.getElementById("totais-dia").innerHTML =
                `💰 Total Normal: R$ ${totalNormal} <br> 💰 Total Especial PMG: R$ ${totalPMG} <br> TOTAL GERAL: R$ ${totalNormal + totalPMG}`;

            // Totais mensais do mês atual
            const mesAtual = new Date().toISOString().slice(0, 7);
            const totalNormalMes = financeiro.meses[mesAtual]?.normaisTotal || 0;
            const totalPMGMes = financeiro.meses[mesAtual]?.pmgTotal || 0;
        }

        // Atualiza gráficos
        function atualizarGraficos(normais, pmg) {
            const ctx = document.getElementById('grafico').getContext('2d');
            const categorias = ['Simples', 'P', 'M', 'G', 'Especial'];
            const valores = [
                normais.filter(x => !x.especial).reduce((a, b) => a + VALOR_SIMPLES, 0) + normais.filter(x => x.especial).reduce((a, b) => a + b.valor, 0),
                pmg.filter(x => x.categoria === 'P').reduce((a, b) => a + b.valor, 0),
                pmg.filter(x => x.categoria === 'M').reduce((a, b) => a + b.valor, 0),
                pmg.filter(x => x.categoria === 'G').reduce((a, b) => a + b.valor, 0),
                pmg.filter(x => !x.categoria).reduce((a, b) => a + b.valor, 0)
            ];
            if (window.graficoInstance) window.graficoInstance.destroy();
            window.graficoInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: categorias, datasets: [{ label: 'Financeiro por Categoria 🔥', data: valores, backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#AA66CC'] }] },
                options: { responsive: true }
            });
        }

        // Filtrar por datas
        function filtrar() {
            const inicioInput = document.getElementById('data-inicio').value;
            const fimInput = document.getElementById('data-fim').value;
            if (!inicioInput || !fimInput) return alert("Escolha as duas datas!");

            const inicio = new Date(inicioInput + "T00:00:00");
            const fim = new Date(fimInput + "T23:59:59");

            const filtradosNormais = dadosNormais.filter(l => {
                const d = new Date(l.data_hora);
                return d >= inicio && d <= fim;
            });

            const filtradosPMG = dadosPMG.filter(l => {
                const d = new Date(l.data_hora);
                return d >= inicio && d <= fim;
            });

            atualizarTotais(filtradosNormais, filtradosPMG);
            atualizarGraficos(filtradosNormais, filtradosPMG);
        }

        // Gerar PDF
        function gerarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(16);
            doc.text("Financeiro Lavacar", 20, 20);

            let y = 30;

            // Pegando o filtro atual
            const inicioInput = document.getElementById('data-inicio').value;
            const fimInput = document.getElementById('data-fim').value;
            let inicio = null, fim = null;
            if (inicioInput && fimInput) {
                inicio = new Date(inicioInput + "T00:00:00");
                fim = new Date(fimInput + "T23:59:59");
            }

            // Função pra filtrar pelo período
            function filtrarPorData(arr) {
                if (!inicio || !fim) return arr;
                return arr.filter(l => {
                    const d = new Date(l.data_hora);
                    return d >= inicio && d <= fim;
                });
            }

            const normaisFiltrados = filtrarPorData(dadosNormais);
            const pmgFiltrados = filtrarPorData(dadosPMG);

            // --- Lavagens Normais ---
            doc.setFontSize(14);
            doc.text("Lavagens Normais", 20, y);
            y += 8;

            let totalNormaisPDF = 0;
            normaisFiltrados.forEach(l => {
                const tipo = l.especial ? "Especial" : "Simples";
                const valor = l.especial ? l.valor : VALOR_SIMPLES;
                totalNormaisPDF += valor;
                doc.setFontSize(12);
                doc.text(`${l.placa} | ${tipo} | R$ ${valor} | ${new Date(l.data_hora).toLocaleDateString('pt-BR')}`, 20, y);
                y += 7;
                if (y > 280) { doc.addPage(); y = 20; } // cria página nova se passar do limite
            });

            doc.setFontSize(13);
            doc.text(`Total Lavagens Normais: R$ ${totalNormaisPDF}`, 20, y);
            y += 10;

            // --- Lavagens PMG ---
            doc.setFontSize(14);
            doc.text("Lavagens PMG", 20, y);
            y += 8;

            let totalPMGPDF = 0;
            pmgFiltrados.forEach(l => {
                const categoria = l.categoria || "Especial";
                totalPMGPDF += l.valor;
                doc.setFontSize(12);
                doc.text(`${l.placa} | ${categoria} | R$ ${l.valor} | ${new Date(l.data_hora).toLocaleDateString('pt-BR')}`, 20, y);
                y += 7;
                if (y > 280) { doc.addPage(); y = 20; }
            });

            doc.setFontSize(13);
            doc.text(`Total Lavagens PMG: R$ ${totalPMGPDF}`, 20, y);
            y += 10;

            // --- Total Geral ---
            doc.setFontSize(14);
            doc.text(`TOTAL DO PERÍODO: R$ ${totalNormaisPDF + totalPMGPDF}`, 20, y);

            // Salvar PDF
            doc.save(`financeiro_${inicioInput || 'todo'}_${fimInput || 'todo'}.pdf`);
        }

        function exportarExcel() {
            const inicioInput = document.getElementById('data-inicio').value;
            const fimInput = document.getElementById('data-fim').value;
            let inicio = null, fim = null;
            if (inicioInput && fimInput) {
                inicio = new Date(inicioInput + "T00:00:00");
                fim = new Date(fimInput + "T23:59:59");
            }

            // Função para filtrar por datas
            function filtrarPorData(arr) {
                if (!inicio || !fim) return arr;
                return arr.filter(l => {
                    const d = new Date(l.data_hora);
                    return d >= inicio && d <= fim;
                });
            }

            const normaisFiltrados = filtrarPorData(dadosNormais);
            const pmgFiltrados = filtrarPorData(dadosPMG);

            // Criar planilha
            const wb = XLSX.utils.book_new();

            // --- Lavagens Normais ---
            const dadosNormaisExcel = normaisFiltrados.map(l => ({
                Placa: l.placa,
                Tipo: l.especial ? "Especial" : "Simples",
                Valor: l.especial ? l.valor : VALOR_SIMPLES,
                Data: new Date(l.data_hora).toLocaleDateString('pt-BR')
            }));

            // Total das Normais
            const totalNormais = dadosNormaisExcel.reduce((s, l) => s + l.Valor, 0);
            dadosNormaisExcel.push({ Placa: "", Tipo: "TOTAL", Valor: totalNormais, Data: "" });

            const wsNormais = XLSX.utils.json_to_sheet(dadosNormaisExcel);
            XLSX.utils.book_append_sheet(wb, wsNormais, "Lavagens Normais");

            // --- Lavagens PMG ---
            const dadosPMGExcel = pmgFiltrados.map(l => ({
                Placa: l.placa,
                Categoria: l.categoria || "Especial",
                Valor: l.valor,
                Data: new Date(l.data_hora).toLocaleDateString('pt-BR')
            }));

            // Total PMG
            const totalPMG = dadosPMGExcel.reduce((s, l) => s + l.Valor, 0);
            dadosPMGExcel.push({ Placa: "", Categoria: "TOTAL", Valor: totalPMG, Data: "" });

            const wsPMG = XLSX.utils.json_to_sheet(dadosPMGExcel);
            XLSX.utils.book_append_sheet(wb, wsPMG, "Lavagens PMG");

            // Baixar arquivo
            XLSX.writeFile(wb, `financeiro_${inicioInput || 'todo'}_${fimInput || 'todo'}.xlsx`);
        }


        // Reset diário automático
        function atualizarFinanceiroDiario() {
            const hoje = new Date().toISOString().slice(0, 10);
            const mesAtual = hoje.slice(0, 7);

            // Acumular dias no mês
            for (const dia in financeiro.dias) {
                const diaData = financeiro.dias[dia];
                const totalNormais = diaData.normais.reduce((a, b) => a + b.valor, 0);
                const totalPMG = diaData.pmg.reduce((a, b) => a + b.valor, 0);
                const mesDia = dia.slice(0, 7);
                if (!financeiro.meses[mesDia]) financeiro.meses[mesDia] = { normaisTotal: 0, pmgTotal: 0 };
                financeiro.meses[mesDia].normaisTotal += totalNormais;
                financeiro.meses[mesDia].pmgTotal += totalPMG;
            }

            // Zera os dias
            financeiro.dias = {};
            salvarLocalStorage();
        }

        // Agendar reset diário à meia-noite
        function agendarResetDiario() {
            const agora = new Date();
            const proximoMeiaNoite = new Date();
            proximoMeiaNoite.setHours(24, 0, 0, 0);
            const ms = proximoMeiaNoite - agora;

            setTimeout(() => {
                atualizarFinanceiroDiario();
                agendarResetDiario();
            }, ms);
        }

        // Buscar mês
        function buscarMes(mes) { // mes = "YYYY-MM"
            if (financeiro.meses[mes]) {
                const totNormais = financeiro.meses[mes].normaisTotal;
                const totPMG = financeiro.meses[mes].pmgTotal;
                alert(`Mês ${mes}\nNormais: R$ ${totNormais}\nPMG: R$ ${totPMG}`);
            } else {
                alert("Mês não encontrado");
            }
        }

        // Inicialização
        carregarLocalStorage();
        carregarFinanceiro();
        agendarResetDiario();
    </script>
